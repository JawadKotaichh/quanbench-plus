[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanbench-plus"
version = "0.1.0"
description = "LLM evaluation pipelines for quantum coding tasks (pass@k and feedback loop)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "certifi==2025.11.12",
  "charset-normalizer==3.4.4",
  "contourpy==1.3.3",
  "cycler==0.12.1",
  "dotenv==0.9.9",
  "fonttools==4.60.1",
  "idna==3.11",
  "kiwisolver==1.4.9",
  "matplotlib==3.10.7",
  "networkx>=3.0",
  "numpy==2.3.5",
  "packaging==25.0",
  "pandas==2.3.3",
  "pillow==12.0.0",
  "pyparsing==3.2.5",
  "python-dateutil==2.9.0.post0",
  "python-dotenv==1.2.1",
  "pytz==2025.2",
  "requests==2.32.5",
  "seaborn==0.13.2",
  "six==1.17.0",
  "tzdata==2025.2",
  "urllib3==2.5.0",
  "cirq==1.6.1",
  "cirq-aqt==1.6.1",
  "cirq-core==1.6.1",
  "cirq-google==1.6.1",
  "cirq-ionq==1.6.1",
  "cirq-pasqal==1.6.1",
  "cirq-web==1.6.1",
  "qiskit",
  "qiskit-aer",
  "qiskit-algorithms",
  "pennylane",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "canonical_results*",
  "feedback_loop*",
  "graders*",
  "pass_at_k_pipeline*",
  "prompts*",
  "utils*",
]

[tool.setuptools.package-data]
canonical_results = ["canonical_solutions.json"]
prompts = ["*.jsonl"]
